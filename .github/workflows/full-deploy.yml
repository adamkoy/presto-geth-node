name: Full Pipeline (Image → Terraform → Helm)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (dev, stage, prod)"
        required: true
        default: "dev"
        type: choice
        options: ["dev", "stage", "prod"]

permissions:
  id-token: write
  contents: read
  packages: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  WORKLOAD_IMAGE: ${{ secrets.WORKLOAD_IMAGE }}

jobs:
  build-image:
    name: Build & Push Load Generator Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push load generator image
        uses: docker/build-push-action@v5
        with:
          context: ./load-generator-image
          file: ./load-generator-image/Dockerfile.workload
          push: true
          platforms: linux/amd64
          tags: ${{ env.WORKLOAD_IMAGE }}

  terraform:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest
    needs: build-image
    environment: presto-${{ github.event.inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials from OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform init
        working-directory: .
        run: terraform init -input=false

      - name: Terraform fmt
        working-directory: .
        run: terraform fmt -check

      - name: Terraform validate
        working-directory: .
        run: terraform validate

      - name: Terraform plan
        working-directory: .
        run: terraform plan -input=false

      - name: Terraform apply (requires environment approval)
        working-directory: .
        run: terraform apply -input=false -auto-approve

  helm:
    name: Helm Deploy
    runs-on: ubuntu-latest
    needs: terraform
    environment: presto-${{ github.event.inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials from OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Set up Terraform (for eks_connect output)
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform init (read remote state)
        working-directory: .
        run: terraform init -input=false

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "latest"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "latest"

      - name: Configure kubectl for EKS
        working-directory: .
        run: |
          EKS_CONNECT_CMD=$(terraform output -raw eks_connect)
          echo "Running: $EKS_CONNECT_CMD"
          eval "$EKS_CONNECT_CMD"

      - name: Deploy Helm charts (Geth, Observability, Load Generator)
        working-directory: .
        run: |
          helm upgrade --install geth ./charts/geth-node
          helm upgrade --install observability ./charts/observability
          helm upgrade --install loadgen ./charts/load-generator


