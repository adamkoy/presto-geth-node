name: Terraform + Helm Deploy

on:
    push:
        branches: [infra-setup]
        paths:
            - "main.tf"
            - "variables.tf"
            - "trust-policy-ebs-csi.json"
            - "charts/**"
            - ".github/workflows/infra-deploy.yml"
    workflow_dispatch:
        inputs:
            apply:
                description: "Run terraform apply and deploy Helm charts after plan?"
                required: true
                default: "false"
                type: choice
                options: ["false", "true"]
            environment:
                description: "Target environment (dev, stage, prod)"
                required: true
                default: "dev"
                type: choice
                options: ["dev", "stage", "prod"]

permissions:
    id-token: write
    contents: read

env:
    AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
    terraform-plan:
        name: Terraform Plan
        runs-on: ubuntu-latest
        # Use presto-<env> where env is an input on manual runs, otherwise dev
        environment: presto-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'dev' }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Configure AWS credentials from OIDC
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_NAME }}
                  aws-region: ${{ env.AWS_REGION }}
                  role-session-name: GitHubActions-${{ github.run_id }}

            - name: Set up Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: 1.9.8

            - name: Terraform init
              working-directory: .
              run: terraform init -input=false

            - name: Terraform fmt
              working-directory: .
              run: terraform fmt -check

            - name: Terraform validate
              working-directory: .
              run: terraform validate

            - name: Terraform plan
              working-directory: .
              run: terraform plan -input=false

    terraform-apply-and-helm:
        name: Terraform Apply + Helm Deploy
        runs-on: ubuntu-latest
        needs: terraform-plan
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.apply == 'true'
        # Same environment name pattern as plan job
        environment: presto-${{ github.event.inputs.environment }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Configure AWS credentials from OIDC
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_NAME }}
                  aws-region: ${{ env.AWS_REGION }}
                  role-session-name: GitHubActions-${{ github.run_id }}

            - name: Set up Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: 1.9.8

            - name: Terraform init
              working-directory: .
              run: terraform init -input=false

            - name: Terraform apply
              working-directory: .
              run: terraform apply -input=false -auto-approve

            - name: Install kubectl
              uses: azure/setup-kubectl@v4
              with:
                  version: "latest"

            - name: Install Helm
              uses: azure/setup-helm@v4
              with:
                  version: "latest"

            - name: Configure kubectl for EKS
              working-directory: .
              run: |
                  EKS_CONNECT_CMD=$(terraform output -raw eks_connect)
                  echo "Running: $EKS_CONNECT_CMD"
                  eval "$EKS_CONNECT_CMD"

            - name: Deploy Helm charts (Geth, Observability, Load Generator)
              working-directory: .
              run: |
                  helm upgrade --install geth ./charts/geth-node
                  helm upgrade --install observability ./charts/observability
                  helm upgrade --install loadgen ./charts/load-generator
